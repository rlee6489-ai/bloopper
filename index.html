<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloopper</title>
<style>
:root{--bg:#15122b;--panel:#201c3d;--line:#2f2a55;--ink:#f6f3ff;--mute:#a9a3d1;--hot:#ff3d81;--sun:#ffc933;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}
main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%}.view.on{display:flex;flex-direction:column}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;padding:10px 0;font-size:11px;min-width:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:18px;font-weight:400}
nav button.on{color:var(--sun)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo i{color:var(--hot);font-style:normal}
.seg{display:flex;background:var(--panel);border-radius:20px;padding:3px}
.seg button{padding:6px 14px;border-radius:17px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
/* clips */
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.clip{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;overflow:hidden}
.clip .art{position:absolute;inset:0;background-size:300% 300%;animation:drift 8s ease-in-out infinite alternate}
.clip .big{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:90px;opacity:.9}
@keyframes drift{to{background-position:100% 100%}}
@media(prefers-reduced-motion:reduce){.clip .art{animation:none}}
.clip .info{position:relative;padding:14px 74px 18px 14px;background:linear-gradient(transparent,rgba(10,8,25,.85));width:100%}
.clip .who{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clip p{margin-top:6px;font-size:14px;line-height:1.4}
.side{position:absolute;right:8px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center}
.side button{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px}
.side button b{font-size:28px;font-weight:400;filter:drop-shadow(0 1px 3px #0008)}
.side .liked b{color:var(--hot)}
.pill{padding:4px 12px;border-radius:14px;font-size:12px;font-weight:700;background:var(--hot);color:#fff}
.pill.alt{background:transparent;border:1px solid var(--ink)}
.pill.sub{background:var(--sun);color:#2a2000}
/* posts */
.scroll{flex:1;overflow-y:auto}
.compose{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.compose textarea{flex:1;background:none;border:0;color:var(--ink);font:inherit;resize:none;height:56px}
.compose .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.post{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.post .name{font-weight:800}.post .h{color:var(--mute);font-size:13px}
.post .txt{margin:3px 0 8px;line-height:1.4;font-size:15px;word-break:break-word}
.acts{display:flex;gap:26px;color:var(--mute);font-size:13px}
.acts .on{color:var(--hot)}.acts .rt.on{color:var(--sun)}
/* market */
.chips{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:16px;background:var(--panel);font-size:13px;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.item{background:var(--panel);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.item .pic{aspect-ratio:1;display:grid;place-items:center;font-size:54px;position:relative}
.item .pic button{position:absolute;top:6px;right:8px;font-size:20px}
.item .b{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.item .price{font-weight:800;color:var(--sun);font-size:16px}
.item .t{font-size:14px;line-height:1.3}.item small{color:var(--mute)}
.item .pill{margin-top:6px;text-align:center}
.sellf{margin:10px 14px 0;padding:12px;background:var(--panel);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.sellf input,.sellf select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font:inherit}
/* old-timeline look */
#posts{background:#e6ecf0;color:#292f33;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#posts .tw-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e1e8ed;display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
#posts .tw-head b{font-size:18px}#posts .tw-head span{color:#55acee;font-size:13px;font-weight:700}
#posts .tw-me{background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-bottom:1px solid #e1e8ed}
#posts .tw-me div{text-align:center;font-size:11px;color:#8899a6}#posts .tw-me b{display:block;font-size:16px;color:#292f33}
#posts .compose{background:#ddeef6;border-bottom:1px solid #c0deed;padding:12px}
#posts .compose textarea{background:#fff;border:1px solid #ccd6dd;border-radius:4px;color:#292f33;padding:8px;width:100%;height:64px}
#posts .compose .row{margin-top:6px;color:#8899a6}
#posts .tw-btn{background:#55acee;color:#fff;border-radius:4px;padding:6px 14px;font-weight:700;font-size:13px}
#posts .tw-btn.sm{padding:4px 10px;font-size:12px}#posts .tw-btn.on{background:#fff;color:#55acee;border:1px solid #55acee}
#posts .av{border-radius:4px}
#posts .post{background:#fff;border-bottom:1px solid #e1e8ed}
#posts .post .h{color:#8899a6}#posts .lk{color:#0084b4}
#posts .acts{color:#8899a6}#posts .acts button{font-size:12px;color:inherit}
#posts .acts .rt.on{color:#77b255}#posts .acts .fv.on{color:#ffac33}
#posts .tw-box{background:#fff;margin:10px 0;border-top:1px solid #e1e8ed;border-bottom:1px solid #e1e8ed}
#posts .tw-box h4{padding:10px 14px;font-size:14px;border-bottom:1px solid #e1e8ed}
#posts .tw-box .card{border-bottom:1px solid #f0f3f5;color:#292f33}#posts .tw-box .card small{color:#8899a6}
#posts .tw-box .tr{padding:8px 14px;border-bottom:1px solid #f0f3f5;color:#0084b4;font-size:14px}
.logoimg{height:36px;border-radius:8px;background:#fef4e8;display:block}
#splash{position:fixed;inset:0;z-index:99;background:#fdf0e4;display:grid;place-items:center;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}
@keyframes so{to{opacity:0;visibility:hidden}}
#splash{animation:so .4s 6s forwards}
#splash video{width:min(100vw,100vh,520px);height:auto;display:block}
#splash small{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#8a7a6a;font-size:13px}
#auth{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px 30px}
#auth.off,#gate.off{display:none}
.thumb{width:128px;aspect-ratio:16/9;border-radius:8px;display:grid;place-items:center;font-size:26px;flex:none}
.ban{aspect-ratio:16/6;display:grid;place-items:center;font-size:60px}
.x-av img,.av img,.card .av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.x-av,.av{overflow:hidden}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;justify-content:center;padding:24px 20px;overflow-y:auto}
.vb{font-style:normal;color:#1d9bf0;font-size:13px}
.opt{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.rnd{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.rnd small{color:var(--mute)}
.pip{position:absolute;right:10px;top:44px;width:64px;height:84px;border-radius:10px;background:#0006;border:2px solid #fff;display:grid;place-items:center;font-size:30px}
.a-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.a-box .logoimg{height:44px;align-self:center}
.a-box p.t{text-align:center;color:var(--mute);font-size:15px}
.a-box label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.a-box input{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;font-size:16px}
.a-av{display:flex;gap:8px;justify-content:space-between}
.a-av button{width:44px;height:44px;border-radius:50%;background:var(--panel);font-size:22px;border:2px solid transparent}
.a-av button.on{border-color:var(--sun)}
.a-go{background:var(--hot);color:#fff;font-weight:800;padding:14px;border-radius:14px;font-size:16px}
.a-alt{border:1px solid var(--line);padding:12px;border-radius:14px}
#aerr{color:#ff8fa8;font-size:14px;min-height:18px}
.a-note{font-size:12px;color:var(--mute);text-align:center}
/* x-style timeline */
#posts{background:#000;color:#e7e9ea;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;position:relative}
.x-tabs{position:sticky;top:0;z-index:3;display:flex;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);border-bottom:1px solid #2f3336}
.x-tabs button{flex:1;padding:14px 0;font-weight:700;color:#71767b;position:relative;font-size:15px}
.x-tabs button.on{color:#e7e9ea}
.x-tabs button.on::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:4px;border-radius:2px;background:#1d9bf0}
.x-row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #2f3336}
.x-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.x-top{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;line-height:1.2}.x-top b{font-size:15px}.x-top span{color:#71767b;font-size:14px}
.x-txt{margin:2px 0 10px;font-size:15px;line-height:1.35;word-break:break-word}.x-txt .lk{color:#1d9bf0}
.x-media{border-radius:16px;border:1px solid #2f3336;aspect-ratio:4/3;display:grid;place-items:center;font-size:72px;margin-bottom:10px}
.x-poll{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.x-opt{text-align:left;padding:4px 0;font-size:16px;color:#e7e9ea}
.x-bar{position:relative;border-radius:6px;background:#16181c;overflow:hidden;padding:9px 12px;font-size:15px;display:flex;justify-content:space-between}
.x-bar i{position:absolute;left:0;top:0;bottom:0;background:#1d3a52}.x-bar span{position:relative}
.x-acts{display:flex;justify-content:space-between;color:#71767b;font-size:13px;max-width:380px}
.x-acts button,.x-acts span{display:flex;gap:5px;align-items:center;color:inherit;font-size:13px}
.x-acts .rp.on{color:#00ba7c}.x-acts .lv.on{color:#f91880}
.x-fab{position:sticky;bottom:14px;display:block;margin:0 14px 14px auto;width:56px;height:56px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:30px;box-shadow:0 4px 14px #000a}
.x-sheet{position:absolute;inset:0;background:#000;z-index:5;display:flex;flex-direction:column}
.x-sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.x-sheet .bd{display:flex;gap:10px;padding:0 14px;flex:1}
.x-sheet textarea{flex:1;background:none;border:0;color:#e7e9ea;font:inherit;font-size:20px;resize:none;padding-top:8px}
.x-post{background:#1d9bf0;color:#fff;font-weight:700;padding:8px 18px;border-radius:20px}
.x-cnt{padding:10px 14px;color:#71767b;font-size:13px;border-top:1px solid #2f3336}
.x-wtf{padding:12px 14px;border-bottom:1px solid #2f3336;background:#16181c}.x-wtf h4{font-size:18px;margin-bottom:8px}
.x-wtf .c{display:flex;align-items:center;gap:10px;padding:6px 0}.x-wtf .m{flex:1;min-width:0}.x-wtf small{display:block;color:#71767b}
.x-fol{background:#e7e9ea;color:#000;border-radius:16px;padding:5px 14px;font-weight:700;font-size:13px}
.x-empty{padding:30px 20px;color:#71767b;text-align:center}
/* live */
.live{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1;overflow-y:auto}
.go{background:var(--hot);color:#fff;font-weight:800;padding:14px;border-radius:14px;font-size:16px}
.stage{border-radius:16px;aspect-ratio:9/12;position:relative;overflow:hidden;background:linear-gradient(160deg,#ff3d81,#6a3dff);display:grid;place-items:center;font-size:80px}
.stage .tag{position:absolute;top:10px;left:10px;font-size:13px;background:var(--hot);padding:3px 10px;border-radius:12px;font-weight:800}
.stage .vw{position:absolute;top:10px;right:10px;font-size:13px;background:#0008;padding:3px 10px;border-radius:12px}
.chat{position:absolute;left:10px;right:10px;bottom:10px;font-size:13px;display:flex;flex-direction:column;gap:3px;max-height:40%;overflow:hidden;justify-content:flex-end}
.chat span{background:#0007;padding:3px 9px;border-radius:10px;align-self:flex-start}
.card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card .m{flex:1;min-width:0}.card .m small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* inbox */
.thread{display:flex;flex-direction:column;flex:1;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;background:var(--panel)}
.bub.me{align-self:flex-end;background:var(--hot)}
.send{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.send input,.search{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px 14px;color:var(--ink);font:inherit}
.sec{padding:10px 14px 4px;font-weight:800;color:var(--mute);font-size:13px}
.back{font-size:22px;padding:0 10px 0 0}
/* profile */
.prof{text-align:center;padding:22px 14px}
.prof .av{width:84px;height:84px;font-size:44px;margin:0 auto 8px}
.stats{display:flex;justify-content:center;gap:28px;margin:14px 0}
.stats b{display:block;font-size:20px}.stats small{color:var(--mute)}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:18px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
</style></head>

 $("#feed").innerHTML=S.clips.map(c=>{const u=U[c.u],lk=S.liked.has("c"+c.id);

 tab('inbox');openDM(i.u);if(!(S.dms[i.u]||[]).length)await sendDM(i.u,'Hi! Is the '+i.t.toLowerCase()+' still available?')}
async function loadMore(){S.dms={};M.items=[];
 await Promise.all([loadClips(),loadDMs(),loadMarket()].map(p=>p.catch(()=>{})));renderClips()}
setInterval(()=>{if(!UID)return;if($('#v-inbox').classList.contains('on'))loadDMs().then(()=>{if(!openThread)renderInbox()}).catch(()=>{});},4000);
setInterval(()=>{if(UID&&!M.sell)loadMarket().then(()=>{if($('#v-market').classList.contains('on')&&$('#mgrid'))drawGrid()}).catch(()=>{})},30000);
init();
setInterval(()=>{if(UID&&!X.c)loadPosts().then(renderPosts).catch(()=>{})},30000);
